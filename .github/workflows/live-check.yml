name: Live smoke check

# NOTE: no `schedule:` trigger. GitHub-hosted runner IPs are blocked/rate-limited
# by the target sites' anti-bot layers (rotating 403/503/empty responses that do
# NOT reproduce from a real network), so a scheduled run false-fails almost every
# week and carries no real signal. The trustworthy safeguard is the daily
# in-service health check, which runs from the Pi's own IP and emails only on
# genuine breaks. This workflow is kept for on-demand manual runs only.
on:
  workflow_dispatch: # manual runs from the Actions tab

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live smoke check against the real sites
        run: python3 scripts/live_smoke_check.py
